name: Update WordPress.org Assets

on:
  push:
    branches:
      - main
    paths:
      - '.wordpress-org/**'
  workflow_dispatch:

jobs:
  assets:
    uses: BrightLeaf-Digital/.github/.github/workflows/wporg-assets.yml@main
    with:
      product_id: 'f4g'
    secrets:
      BLD_API_KEY: ${{ secrets.BLD_API_KEY }}
      WP_SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      WP_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
