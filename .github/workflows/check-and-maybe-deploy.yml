name: Check with PCP and maybe Deploy to WordPress.org
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: false
  push:
    tags:
      - '*'
jobs:
  trigger-workflow:
    uses: BrightLeaf-Digital/.github/.github/workflows/deploy.yml@main
    with:
      product_id: 'f4g'
      version: ${{ github.event.inputs.version }}
      zip_files: 'assets docs includes vendor *.php readme.txt composer.json'
    secrets:
      BLD_API_KEY: ${{ secrets.BLD_API_KEY }}
      WP_SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      WP_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}
